[project]
name = "comfyui-splash"
version = "0.1.0"
description = "Demo ComfyUI nodes that generate MiniMax-H3 videos on a local Splash server; kept in the Splash repository at integrations/comfyui/."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["aiohttp", "numpy", "pillow", "av"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.comfy]
DisplayName = "Splash"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
