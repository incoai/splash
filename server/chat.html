<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splash</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/chat-assets/github-11.12.0.min.css">
<link rel="stylesheet" href="/chat-assets/github-dark-11.12.0.min.css" media="(prefers-color-scheme: dark)">
<style>
  * { box-sizing: border-box }
  :root {
    color-scheme: light dark;
    --sidebar: 260px;
    --sidebar-duration: .22s;
    --bg: #fff;
    --side: #f9f9f9;
    --text: #171717;
    --muted: #727272;
    --link: #2563eb;
    --hover: #ececec;
    --bubble: #f1f1f1;
    --composer: #fff;
    --border: #e5e5e5;
    --shadow: 0 8px 28px #00000012;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --side: #181818;
      --text: #ececec;
      --muted: #9b9b9b;
      --link: #60a5fa;
      --hover: #2b2b2b;
      --bubble: #303030;
      --composer: #2f2f2f;
      --border: #424242;
      --shadow: 0 8px 28px #0005;
    }
  }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  button, input, textarea, select { color: inherit; font: inherit }
  button { border: 0; background: none; cursor: pointer }
  button:disabled { cursor: default; opacity: .45 }
  svg { display: block }

  aside { position: fixed; inset: 0 auto 0 0; z-index: 20; overflow-y: auto; width: 260px; padding: 12px 8px; background: var(--side); border-right: 1px solid var(--border); transition: transform var(--sidebar-duration) ease, visibility 0s }
  .brand { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 10px; font-size: 17px; font-weight: 650; letter-spacing: -.02em }
  .brand img { width: 19px; height: 19px }
  #sidebar-close, #sidebar-open { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 9px; color: var(--muted) }
  #sidebar-close { margin-left: auto }
  #sidebar-open { position: fixed; top: 14px; left: 18px; z-index: 12; display: none }
  #sidebar-close:hover, #sidebar-open:hover { color: var(--text); background: var(--hover) }
  #new-chat { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 9px; padding: 9px 10px; border-radius: 9px; text-align: left }
  #new-chat:hover { background: var(--hover) }
  #new-chat svg { width: 18px; height: 18px }
  .recent-label { margin: 22px 10px 7px; color: var(--muted); font-size: 12px; font-weight: 600 }
  #recents { display: grid; gap: 2px }
  .recent { position: relative; display: flex; align-items: center; width: 100%; border-radius: 9px; overflow: hidden }
  .recent:hover, .recent.active { background: var(--hover) }
  .recent-open { flex: 1; min-width: 0; padding: 8px 10px; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap }
  .recent-delete { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); opacity: 0; pointer-events: none }
  .recent:hover .recent-open, .recent:focus-within .recent-open { padding-right: 38px }
  .recent:hover .recent-delete, .recent:focus-within .recent-delete { opacity: 1; pointer-events: auto }
  .recent-delete:hover { color: var(--text); background: var(--bubble) }
  @media (hover: none) {
    .recent-open { padding-right: 38px }
    .recent-delete { opacity: 1; pointer-events: auto }
  }

  .credentials { display: block; margin: 18px 10px; color: var(--muted); font-size: 12px }
  #api-key { width: 100%; margin-top: 6px; padding: 6px 8px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px }

  main { min-height: 100vh; margin-left: var(--sidebar); transition: margin-left var(--sidebar-duration) ease }
  #chat { width: min(760px, 100%); margin: auto; padding: 38px 20px 150px }
  #empty { position: fixed; top: calc(50% - 58px); left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); transform: translateX(-50%); font-size: 25px; font-weight: 600; letter-spacing: -.025em; transition: left var(--sidebar-duration) ease }
  .message { margin: 28px 0; overflow-wrap: anywhere }
  .user { width: fit-content; max-width: 80%; margin-left: auto; padding: 10px 16px; border-radius: 20px; background: var(--bubble); white-space: pre-wrap }
  .user-images { display: flex; flex-wrap: wrap; gap: 8px }
  .user-text + .user-images { margin-top: 9px }
  .user-images img { display: block; width: min(240px, 100%); max-height: 240px; border-radius: 12px; object-fit: cover }
  .assistant { padding: 0 4px }
  .content blockquote { margin: 0 0 1em; padding-left: 14px; border-left: 2px solid var(--border); color: var(--muted) }
  .content hr { margin: 1.5em 0; border: 0; border-top: 1px solid var(--border) }
  .content a { color: var(--link); text-underline-offset: 2px }
  .content :not(pre) > code { padding: .15em .35em; border-radius: 6px; background: var(--bubble); font-size: .9em }
  .table-wrap { overflow-x: auto; margin: 0 0 1em }
  .content table { border-collapse: collapse; width: 100%; overflow-wrap: normal; font-size: .95em }
  .content th, .content td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: left }
  .content th { color: var(--muted); font-weight: 600 }
  .code-block { margin: 12px 0; overflow: hidden; border: 1px solid var(--border); border-radius: 20px; font-size: 13px }
  .code-block > pre { margin: 0; padding: 0; border-radius: 0; background: transparent; font-size: inherit; line-height: 1.55; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  .code-block > pre > code { display: block; overflow-x: auto; padding: 0 13px 13px 13px; background: transparent }
  .code-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 8px }
  .code-language { min-width: 0; overflow: hidden; padding: 0 8px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap }
  .copy-code, .copy-markdown { display: grid; place-items: center; width: 34px; height: 34px; flex: none; padding: 6px; border-radius: 20px; color: var(--muted) }
  .copy-code:hover, .copy-markdown:hover { color: var(--text); background: var(--hover) }
  .copy-markdown[hidden] { display: none }
  .waiting { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  details { margin-bottom: 12px; color: var(--muted); font-size: 14px }
  summary { width: fit-content; cursor: pointer; user-select: none; font-weight: 500 }
  .reasoning { max-height: 300px; overflow-y: auto; margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border); white-space: pre-wrap }
  .reasoning.fade-top { --fade-top: transparent }
  .reasoning.fade-bottom { --fade-bottom: transparent }
  .reasoning.fade-top, .reasoning.fade-bottom { mask-image: linear-gradient(to bottom, var(--fade-top, #000), #000 20px, #000 calc(100% - 20px), var(--fade-bottom, #000)) }
  .message-footer { display: flex; align-items: center; gap: 12px; margin-top: 12px; white-space: normal }
  .message-footer[hidden] { display: none }
  .stats { color: var(--muted); font-size: 12px; line-height: 1.5; white-space: nowrap }
  .error { color: #d33 }

  form { position: fixed; left: calc(var(--sidebar) + (100vw - var(--sidebar)) / 2); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 10; display: flex; align-items: flex-end; gap: 8px; width: min(720px, calc(100vw - var(--sidebar) - 28px)); min-height: 54px; transform: translateX(-50%); padding: 9px; border: 1px solid var(--border); border-radius: 28px; background: var(--composer); box-shadow: var(--shadow); transition: left var(--sidebar-duration) ease, width var(--sidebar-duration) ease }
  #scroll-bottom { position: absolute; right: 8px; bottom: calc(100% + 12px); padding: 7px 13px; border: 1px solid var(--border); border-radius: 20px; background: var(--composer); box-shadow: var(--shadow); font-size: 13px }
  #scroll-bottom[hidden] { display: none }
  #scroll-bottom:hover { background: var(--hover) }
  body.empty form { top: 50%; bottom: auto }
  .composer { min-width: 0; flex: 1 }
  #attachments { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px }
  #attachments:empty { display: none }
  .attachment { position: relative; width: 58px; height: 58px; flex: none }
  .attachment img, .attachment-status { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 12px; object-fit: cover }
  .attachment-status { display: grid; place-items: center; padding: 4px; background: var(--bubble); text-align: center; font-size: 11px; line-height: 1.2 }
  .remove-image { position: absolute; top: -5px; right: -5px; display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; color: #fff; background: #333; font-size: 15px; line-height: 1 }
  textarea { display: block; width: 100%; max-height: 180px; padding: 6px 0; resize: none; border: 0; outline: 0; background: transparent }
  textarea::placeholder { color: var(--muted) }
  .toolbar { display: flex; flex: none; align-items: center; gap: 5px }
  #attach[hidden] { display: none }
  #attach { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: var(--muted) }
  #attach:hover { color: var(--text); background: var(--hover) }
  .effort { position: relative; display: flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 10px; color: var(--muted); font-size: 13px; line-height: 24px }
  .effort:hover, .effort:focus-within { color: var(--text); background: var(--hover) }
  .effort-chevron { position: absolute; right: 10px; top: 50%; width: 12px; height: 12px; transform: translateY(-50%); pointer-events: none }
  select { appearance: none; padding: 0; border: 0; outline: 0; background: transparent; cursor: pointer }
  #effort { padding-right: 18px }
  #send { width: 34px; height: 34px; flex: none; border-radius: 50%; color: var(--bg); background: var(--text); font-size: 17px }
  #send:disabled { color: var(--muted); background: var(--hover) }
  #mobile-header, #scrim { display: none }

  @media (min-width: 721px) {
    body.sidebar-collapsed { --sidebar: 0px }
    body.sidebar-collapsed aside { transform: translateX(-100%); visibility: hidden; pointer-events: none; transition-delay: 0s, var(--sidebar-duration) }
    body.sidebar-collapsed #sidebar-open { display: grid }
  }

  @media (max-width: 720px) {
    :root { --sidebar: 0px }
    aside { transform: translateX(-100%) }
    body.menu-open aside { transform: none }
    #scrim { position: fixed; inset: 0; z-index: 15; background: #0005 }
    body.menu-open #scrim { display: block }
    #mobile-header { position: fixed; inset: 0 0 auto; z-index: 12; display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px) }
    #menu, #mobile-new { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px }
    #menu:hover, #mobile-new:hover { background: var(--hover) }
    #mobile-header .brand { padding: 0; font-size: 16px }
    #chat { padding: 66px 16px 140px }
    #empty { top: calc(50% - 58px); left: 50%; font-size: 23px }
    form { left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); width: calc(100% - 16px) }
    textarea { max-height: 140px }
  }
  @media (max-width: 430px) {
    .effort { padding-left: 5px }
    .effort > span { display: none }
    .user { max-width: 88% }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --sidebar-duration: 0s }
  }
</style>

<aside id="sidebar">
  <div class="brand">
    <img src="/favicon.ico" alt="">
    Splash
    <button id="sidebar-close" type="button" aria-label="Collapse sidebar" title="Collapse sidebar" aria-controls="sidebar" aria-expanded="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m7-12-3 3 3 3"/></svg>
    </button>
  </div>
  <button id="new-chat" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18 2v8M14 6h8"/></svg>
    New chat
  </button>
  <div class="recent-label">Recents</div>
  <nav id="recents" aria-label="Recent chats"></nav>
  <label class="credentials">API key (if required)
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" aria-label="API key">
  </label>
</aside>
<button id="sidebar-open" type="button" aria-label="Open sidebar" title="Open sidebar" aria-controls="sidebar" aria-expanded="false">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18m4-12 3 3-3 3"/></svg>
</button>
<div id="scrim"></div>
<header id="mobile-header">
  <button id="menu" type="button" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">Splash</div>
  <button id="mobile-new" type="button" aria-label="New chat"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18 2v8M14 6h8"/></svg></button>
</header>
<main><div id="chat"></div></main>
<form id="form">
  <button id="scroll-bottom" type="button" hidden aria-label="Jump to latest message">&#8595; Jump to latest</button>
  <button id="attach" type="button" aria-label="Add images" title="Add images">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <input id="image-input" type="file" accept="image/*" multiple hidden>
  <div class="composer">
    <div id="attachments" aria-label="Attached images"></div>
    <textarea id="input" rows="1" placeholder="Message Splash" autofocus></textarea>
  </div>
  <div class="toolbar">
    <label class="effort"><span>Thinking</span>
      <select id="effort" aria-label="Thinking effort">
        <option value="">Default</option>
        <option value="xhigh">XHigh</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
        <option value="none">Off</option>
      </select>
      <svg class="effort-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
    </label>
    <button id="send" aria-label="Send">&#8593;</button>
  </div>
</form>

<script src="/chat-assets/markdown-it-15.0.2.min.js"></script>
<script src="/chat-assets/highlight-11.12.0.min.js"></script>
<script>
  const $ = selector => document.querySelector(selector);
  const chat = $('#chat');
  const form = $('#form');
  const input = $('#input');
  const attachmentsBox = $('#attachments');
  const imageInput = $('#image-input');
  const attach = $('#attach');
  const effort = $('#effort');
  const apiKey = $('#api-key');
  const send = $('#send');
  const recents = $('#recents');
  const scrollBottom = $('#scroll-bottom');
  const mobileLayout = window.matchMedia('(max-width: 720px)');
  const copyIcons = {
    copy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
    error: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>'
  };
  const markdown = window.markdownit({
    html: false,
    breaks: true,
    highlight(source, language) {
      if (language && window.hljs?.getLanguage(language)) {
        return window.hljs.highlight(source, {language, ignoreIllegals: true}).value;
      }
      return ''; // Markdown escapes code for unknown or omitted languages.
    }
  }).disable('image'); // A reply's image would load its URL without a click.
  for (const rule of ['fence', 'code_block']) {
    const renderCode = markdown.renderer.rules[rule];
    markdown.renderer.rules[rule] = (tokens, index, ...args) => {
      const language = markdown.utils.escapeHtml(markdown.utils.unescapeAll(tokens[index].info || '').trim().split(/\s+/)[0] || 'text');
      tokens[index].attrJoin('class', 'hljs');
      return '<div class="code-block"><div class="code-toolbar"><span class="code-language">' + language +
        '</span><button type="button" class="copy-code" title="Copy code" aria-label="Copy code" aria-live="polite">' + copyIcons.copy + '</button></div>' +
        renderCode(tokens, index, ...args) + '</div>';
    };
  }
  // A wide table scrolls inside the message instead of widening it. There
  // are no table rules to wrap, so the generic renderToken emits the tags.
  const renderToken = markdown.renderer.renderToken.bind(markdown.renderer);
  markdown.renderer.rules.table_open = (tokens, index, ...args) =>
    '<div class="table-wrap">' + renderToken(tokens, index, ...args);
  markdown.renderer.rules.table_close = (tokens, index, ...args) =>
    renderToken(tokens, index, ...args) + '</div>';
  // A link opens in a new tab, so following it keeps the chat and its reply.
  markdown.renderer.rules.link_open = (tokens, index, ...args) => {
    tokens[index].attrSet('target', '_blank');
    tokens[index].attrSet('rel', 'noopener noreferrer');
    return renderToken(tokens, index, ...args);
  };
  const storeKey = 'splash-chats';
  const effortKey = 'splash-thinking-effort';
  const allowedEfforts = new Set([...effort.options].map(option => option.value));
  let conversations = load();
  let activeId = null;
  let messages = [];
  let attachments = [];
  let controller;
  let followResponse = false;
  // Until /v1/models says otherwise; a text-only model takes no images.
  let imagesAccepted = true;

  const savedEffort = storageGet(effortKey);
  effort.value = allowedEfforts.has(savedEffort) ? savedEffort : '';

  function authorization() {
    return apiKey.value ? {Authorization: `Bearer ${apiKey.value}`} : {};
  }

  async function loadModalities() {
    try {
      const response = await fetch('/v1/models', {headers: authorization()});
      if (!response.ok) return;
      const modalities = (await response.json()).data?.[0]?.input_modalities;
      if (!Array.isArray(modalities)) return;
      imagesAccepted = modalities.includes('image');
      attach.hidden = !imagesAccepted;
      if (!imagesAccepted) clearAttachments();
    } catch { /* The server still rejects input the model cannot take. */ }
  }

  function storageGet(key) {
    try {
      return localStorage.getItem(key);
    }
    catch { return null; }
  }

  function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    }
    catch { /* Chat still works if browser storage is full or disabled. */ return false; }
  }

  function cleanUserContent(content) {
    if (typeof content === 'string') return content;
    if (!Array.isArray(content)) return null;
    const clean = content.flatMap(part => {
      if (part?.type === 'text' && typeof part.text === 'string') return [{type: 'text', text: part.text}];
      const url = part?.type === 'image_url' ? part.image_url?.url : null;
      return typeof url === 'string' && url.startsWith('data:image/') ? [{type: 'image_url', image_url: {url}}] : [];
    });
    return clean.length ? clean : null;
  }

  function cleanMessage(message) {
    if (!message || !['user', 'assistant'].includes(message.role)) return null;
    const content = message.role === 'user' ? cleanUserContent(message.content) : message.content;
    if (content === null || (message.role === 'assistant' && typeof content !== 'string')) return null;
    const clean = {role: message.role, content};
    if (message.role === 'assistant' && typeof message.reasoning_content === 'string') clean.reasoning_content = message.reasoning_content;
    if (message.role === 'assistant' && Number.isFinite(message.tps) && message.tps > 0) clean.tps = message.tps;
    return clean;
  }

  function load() {
    try {
      const stored = JSON.parse(storageGet(storeKey));
      if (!Array.isArray(stored)) return [];
      const seen = new Set();
      return stored.flatMap(conversation => {
        if (!conversation || typeof conversation.id !== 'string' || seen.has(conversation.id) ||
            typeof conversation.title !== 'string' || !Number.isFinite(conversation.updated) ||
            !Array.isArray(conversation.messages)) return [];
        const messages = conversation.messages.map(cleanMessage).filter(Boolean);
        if (!messages.length) return [];
        seen.add(conversation.id);
        return [{id: conversation.id, title: conversation.title, updated: conversation.updated, messages}];
      });
    } catch { return []; }
  }

  function hasImages(conversation) {
    return conversation.messages.some(message => Array.isArray(message.content) &&
      message.content.some(part => part.type === 'image_url'));
  }

  function withoutImages(conversation) {
    const messages = conversation.messages.map(message => Array.isArray(message.content) ? {
      ...message,
      content: message.content.map(part => part.type === 'image_url' ? {type: 'text', text: '[Image not saved]'} : part)
    } : message);
    return {...conversation, messages};
  }

  function save() {
    conversations.sort((a, b) => b.updated - a.updated);
    conversations = conversations.slice(0, 20);
    // Browser storage holds a few MB per site, which one photo can fill. Rather
    // than fail every later save, store the newest chats that fit, each with its
    // images if they still fit and without them otherwise, so a photo too large
    // to store does not cost older chats theirs. The open page keeps its images.
    if (!storageSet(storeKey, JSON.stringify(conversations))) {
      const stored = [];
      for (const conversation of conversations) {
        const candidates = hasImages(conversation) ? [conversation, withoutImages(conversation)] : [conversation];
        const fitting = candidates.find(candidate => storageSet(storeKey, JSON.stringify([...stored, candidate])));
        if (!fitting) break;
        stored.push(fitting);
      }
    }
    renderRecents();
  }

  function titleFor(text) {
    const title = text.replace(/\s+/g, ' ').trim();
    return title.length > 34 ? `${title.slice(0, 34)}…` : title;
  }

  // crypto.randomUUID exists only in secure contexts, which excludes a LAN
  // address over plain HTTP; getRandomValues works everywhere.
  function chatId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)),
      byte => byte.toString(16).padStart(2, '0')).join('');
  }

  function userParts(content) {
    if (typeof content === 'string') return {text: content, images: []};
    return {
      text: content.filter(part => part.type === 'text').map(part => part.text).join('\n'),
      images: content.filter(part => part.type === 'image_url').map(part => part.image_url.url)
    };
  }

  function requestMessages() {
    return messages.map(({tps, ...message}) => message);
  }

  function displayContent(content) {
    // Remove surrounding blank lines without stripping the first line's indentation.
    return content.replace(/^(?:[ \t]*\r?\n)+|(?:\r?\n[ \t]*)+$/g, '');
  }

  function renderMarkdown(element, content) {
    element.innerHTML = markdown.render(displayContent(content));
  }

  async function copyText(button, text, label) {
    let status;
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      else {
        // Clipboard API is unavailable on LAN addresses served over plain HTTP.
        const field = document.createElement('textarea');
        field.value = text;
        field.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.append(field);
        try {
          field.select();
          if (!document.execCommand('copy')) throw new Error('Copy failed');
        } finally {
          field.remove();
          button.focus({preventScroll: true});
        }
      }
      button.innerHTML = copyIcons.success;
      status = 'Copied!';
    } catch {
      button.innerHTML = copyIcons.error;
      status = 'Copy failed';
    }
    button.title = status;
    button.setAttribute('aria-label', status);
    setTimeout(() => {
      button.innerHTML = copyIcons.copy;
      button.title = label;
      button.setAttribute('aria-label', label);
    }, 1500);
  }

  function updateScrollState() {
    const nearBottom = document.documentElement.scrollHeight - window.scrollY - window.innerHeight <= 300;
    scrollBottom.hidden = nearBottom || !messages.length;
  }

  function scrollToLatest(behavior = 'instant') {
    scrollTo({top: document.documentElement.scrollHeight, behavior});
    updateScrollState();
  }

  function updateResponseScroll() {
    if (controller && followResponse) scrollToLatest();
    else updateScrollState();
  }

  function onPageScroll() {
    followResponse = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 1;
    updateScrollState();
  }

  function updateReasoningFade(reasoning) {
    reasoning.classList.toggle('fade-top', reasoning.scrollTop > 1);
    reasoning.classList.toggle('fade-bottom', reasoning.scrollHeight - reasoning.clientHeight - reasoning.scrollTop > 1);
  }

  function assistantBox(message, live = false) {
    const box = document.createElement('div');
    box.className = 'message assistant';
    const details = document.createElement('details');
    details.open = live;
    details.hidden = !message.reasoning_content;
    details.innerHTML = '<summary>Thinking</summary><div class="reasoning"></div>';
    const reasoning = details.querySelector('.reasoning');
    reasoning.textContent = message.reasoning_content || '';
    reasoning.addEventListener('scroll', () => updateReasoningFade(reasoning), {passive: true});
    details.addEventListener('toggle', () => updateReasoningFade(reasoning));
    const content = document.createElement('div');
    content.className = 'content';
    renderMarkdown(content, message.content || '');
    content.addEventListener('click', event => {
      const button = event.target.closest('.copy-code');
      if (button) copyText(button, button.closest('.code-block').querySelector('code').textContent, 'Copy code');
    });
    const waiting = document.createElement('div');
    waiting.className = 'waiting';
    waiting.hidden = !live || Boolean(message.content || message.reasoning_content);
    waiting.setAttribute('aria-label', 'Generating response');
    const stats = document.createElement('div');
    stats.className = 'stats';
    stats.hidden = !message.tps;
    if (message.tps) stats.textContent = `${Number(message.tps).toLocaleString(undefined, {maximumFractionDigits: 1})} tok/s`;
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'copy-markdown';
    copy.innerHTML = copyIcons.copy;
    copy.title = 'Copy reply as Markdown';
    copy.hidden = !message.content;
    copy.setAttribute('aria-label', 'Copy reply as Markdown');
    copy.setAttribute('aria-live', 'polite');
    copy.addEventListener('click', () => copyText(copy, message.content, 'Copy reply as Markdown'));
    const footer = document.createElement('div');
    footer.className = 'message-footer';
    footer.hidden = stats.hidden && copy.hidden;
    footer.append(copy, stats);
    box.append(details, content, waiting, footer);
    return box;
  }

  function addMessage(message, live = false) {
    const box = message.role === 'assistant' ? assistantBox(message, live) : document.createElement('div');
    if (message.role !== 'assistant') {
      box.className = `message ${message.role}`;
      const {text, images} = userParts(message.content);
      if (text) {
        const content = document.createElement('div');
        content.className = 'user-text';
        content.textContent = text;
        box.append(content);
      }
      if (images.length) {
        const gallery = document.createElement('div');
        gallery.className = 'user-images';
        images.forEach(url => {
          const image = document.createElement('img');
          image.src = url;
          image.alt = 'Attached image';
          gallery.append(image);
        });
        box.append(gallery);
      }
    }
    chat.append(box);
    return box;
  }

  function renderChat() {
    chat.replaceChildren();
    document.body.classList.toggle('empty', !messages.length);
    if (!messages.length) {
      const empty = document.createElement('div');
      empty.id = 'empty';
      empty.textContent = 'How can I help?';
      chat.append(empty);
    } else messages.forEach(message => addMessage(message));
    scrollToLatest();
  }

  function renderRecents() {
    recents.replaceChildren();
    conversations.forEach(conversation => {
      const item = document.createElement('div');
      item.className = `recent${conversation.id === activeId ? ' active' : ''}`;
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'recent-open';
      open.textContent = conversation.title;
      open.title = conversation.title;
      open.disabled = Boolean(controller);
      open.addEventListener('click', () => openChat(conversation.id));
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'recent-delete';
      remove.setAttribute('aria-label', `Delete chat: ${conversation.title}`);
      remove.title = 'Delete chat';
      remove.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>';
      remove.disabled = Boolean(controller);
      remove.addEventListener('click', () => deleteChat(conversation.id));
      item.append(open, remove);
      recents.append(item);
    });
  }

  function deleteChat(id) {
    if (controller) return;
    const conversation = conversations.find(item => item.id === id);
    if (!conversation || !window.confirm(`Delete chat "${conversation.title}"? This cannot be undone.`)) return;
    conversations = conversations.filter(conversation => conversation.id !== id);
    if (activeId === id) newChat();
    save();
  }

  function newChat() {
    if (controller) return;
    activeId = null;
    messages = [];
    clearAttachments();
    document.body.classList.remove('menu-open');
    updateSidebar();
    renderChat();
    renderRecents();
    input.focus({preventScroll: true});
  }

  function openChat(id) {
    if (controller) return;
    const conversation = conversations.find(item => item.id === id);
    if (!conversation) return;
    activeId = id;
    messages = conversation.messages;
    clearAttachments();
    document.body.classList.remove('menu-open');
    updateSidebar();
    renderChat();
    renderRecents();
    input.focus({preventScroll: true});
  }

  function persist(firstPrompt) {
    let conversation = conversations.find(item => item.id === activeId);
    if (!conversation) {
      conversation = {id: chatId(), title: titleFor(firstPrompt), messages, updated: Date.now()};
      conversations.push(conversation);
      activeId = conversation.id;
    }
    conversation.messages = messages;
    conversation.updated = Date.now();
    save();
  }

  function resize() {
    input.style.height = 'auto';
    input.style.height = `${input.scrollHeight}px`;
  }

  function updateSidebar() {
    if (!mobileLayout.matches) document.body.classList.remove('menu-open');
    const expanded = mobileLayout.matches
      ? document.body.classList.contains('menu-open')
      : !document.body.classList.contains('sidebar-collapsed');
    $('#sidebar').inert = !expanded;
    for (const id of ['sidebar-close', 'sidebar-open', 'menu']) {
      $('#' + id).setAttribute('aria-expanded', String(expanded));
    }
  }

  function setSidebarOpen(open) {
    if (mobileLayout.matches) document.body.classList.toggle('menu-open', open);
    else document.body.classList.toggle('sidebar-collapsed', !open);
    updateSidebar();
    $(open ? '#sidebar-close' : mobileLayout.matches ? '#menu' : '#sidebar-open').focus({preventScroll: true});
  }

  function renderAttachments() {
    attachmentsBox.replaceChildren();
    attachments.forEach(attachment => {
      const item = document.createElement('div');
      item.className = 'attachment';
      const name = attachment.name || 'Attached image';
      item.title = name;
      const preview = document.createElement(attachment.url ? 'img' : 'span');
      if (attachment.url) {
        preview.src = attachment.url;
        preview.alt = name;
      } else {
        preview.className = `attachment-status${attachment.error ? ' error' : ''}`;
        preview.textContent = attachment.error ? 'Read failed' : 'Loading…';
        preview.setAttribute('role', 'status');
      }
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove-image';
      remove.setAttribute('aria-label', `Remove ${name}`);
      remove.textContent = '\u00d7';
      remove.addEventListener('click', () => {
        attachments = attachments.filter(value => value !== attachment);
        renderAttachments();
      });
      item.append(preview, remove);
      attachmentsBox.append(item);
    });
    updateComposer();
  }

  function clearAttachments() {
    attachments = [];
    imageInput.value = '';
    renderAttachments();
  }

  function readImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  async function addImages(files) {
    const images = Array.from(files).filter(file => file.type.startsWith('image/'));
    if (!images.length) return;
    // Readers update stable entries, even if rollback moves them to a new draft.
    const selected = images.map(file => ({name: file.name, url: null, error: false}));
    attachments.push(...selected);
    renderAttachments();
    await Promise.all(images.map(async (file, index) => {
      const attachment = selected[index];
      try {
        attachment.url = await readImage(file);
      } catch {
        attachment.error = true;
      }
      if (attachments.includes(attachment)) renderAttachments();
    }));
  }

  function canSend() {
    return Boolean(input.value.trim() || attachments.length) &&
      attachments.every(attachment => attachment.url);
  }

  function updateComposer() {
    send.disabled = !controller && !canSend();
  }

  function setRunning(running) {
    send.textContent = running ? '\u25a0' : '\u2191';
    send.setAttribute('aria-label', running ? 'Stop' : 'Send');
    effort.disabled = running;
    attach.disabled = running;
    $('#new-chat').disabled = running;
    $('#mobile-new').disabled = running;
    renderRecents();
    updateComposer();
  }

  function consume(event, assistant, box) {
    const data = event.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('\n');
    if (!data || data === '[DONE]') return data === '[DONE]';
    const chunk = JSON.parse(data);
    if (chunk.error) throw new Error(chunk.error.message);
    const speed = Number(chunk.metrics?.request_latency?.stream_tokens_per_second);
    if (Number.isFinite(speed) && speed > 0) {
      assistant.tps = speed;
      const stats = box.querySelector('.stats');
      stats.textContent = `${speed.toLocaleString(undefined, {maximumFractionDigits: 1})} tok/s`;
      stats.hidden = false;
      box.querySelector('.message-footer').hidden = false;
    }
    const delta = chunk.choices?.[0]?.delta;
    // A chunk without text has nothing to show or scroll to.
    if (!delta?.reasoning_content && !delta?.content) return false;
    box.querySelector('.waiting').hidden = true;
    if (delta.reasoning_content) {
      assistant.reasoning_content += delta.reasoning_content;
      const details = box.querySelector('details');
      details.hidden = false;
      const reasoning = details.querySelector('.reasoning');
      // Thinking follows new text unless the reader scrolled up inside it.
      const atEnd = reasoning.scrollHeight - reasoning.clientHeight - reasoning.scrollTop <= 1;
      reasoning.textContent = assistant.reasoning_content;
      if (atEnd) reasoning.scrollTop = reasoning.scrollHeight;
      updateReasoningFade(reasoning);
    }
    if (delta.content) {
      assistant.content += delta.content;
      renderMarkdown(box.querySelector('.content'), assistant.content);
      box.querySelector('.copy-markdown').hidden = false;
      box.querySelector('.message-footer').hidden = false;
    }
    updateResponseScroll();
    return false;
  }

  async function complete() {
    if (controller || !canSend()) return;
    const text = input.value.trim();
    const pendingAttachments = attachments;
    const content = pendingAttachments.length ? [
      ...(text ? [{type: 'text', text}] : []),
      ...pendingAttachments.map(attachment => ({type: 'image_url', image_url: {url: attachment.url}}))
    ] : text;
    input.value = '';
    attachments = [];
    renderAttachments();
    resize();
    document.body.classList.remove('empty');
    $('#empty')?.remove();
    messages.push({role: 'user', content});
    const userBox = addMessage(messages.at(-1));
    const assistant = {role: 'assistant', content: '', reasoning_content: ''};
    const box = addMessage(assistant, true);
    followResponse = true;
    scrollToLatest();
    controller = new AbortController();
    setRunning(true);
    try {
      const response = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...authorization()},
        body: JSON.stringify({messages: requestMessages(), stream: true, stream_options: {include_usage: true}, ...(effort.value ? {reasoning_effort: effort.value} : {})}),
        signal: controller.signal
      });
      if (!response.ok) throw new Error((await response.json()).error?.message || response.statusText);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let doneEvent = false;
      while (true) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop();
        events.forEach(event => { doneEvent ||= consume(event, assistant, box); });
        if (done) break;
      }
      if (buffer) doneEvent ||= consume(buffer, assistant, box);
      if (!doneEvent) throw new Error('Connection closed early');
      box.querySelector('.waiting').hidden = true;
      messages.push(assistant);
      persist(text || pendingAttachments[0]?.name || 'Image');
    } catch (error) {
      messages.pop();
      userBox.remove();
      box.remove();
      if (!messages.length) renderChat();
      if (input.value === '') input.value = text;
      // Restore the submitted entries alongside the next draft's pending reads.
      attachments.unshift(...pendingAttachments);
      renderAttachments();
      resize();
      if (error.name !== 'AbortError') {
        const note = addMessage({role: 'assistant', content: error.message});
        note.classList.add('error');
      }
    } finally {
      box.querySelector('details')?.removeAttribute('open');
      followResponse = false;
      controller = undefined;
      setRunning(false);
      updateScrollState();
      input.focus({preventScroll: true});
    }
  }

  form.addEventListener('submit', event => { event.preventDefault(); controller ? controller.abort() : complete(); });
  effort.addEventListener('change', () => {
    storageSet(effortKey, effort.value);
  });
  attach.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => {
    if (imagesAccepted) addImages(imageInput.files).catch(console.error);
    imageInput.value = '';
  });
  input.addEventListener('paste', event => {
    // Without image input the browser pastes as usual.
    if (!imagesAccepted) return;
    const images = Array.from(event.clipboardData?.items || [])
      .filter(item => item.type.startsWith('image/'))
      .map(item => item.getAsFile())
      .filter(Boolean);
    if (!images.length) return;
    if (!event.clipboardData.getData('text/plain')) event.preventDefault();
    addImages(images).catch(console.error);
  });
  input.addEventListener('input', () => { resize(); updateComposer(); });
  input.addEventListener('keydown', event => {
    // Safari can end composition before the confirming Enter keydown.
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); complete(); }
  });
  apiKey.addEventListener('change', loadModalities);
  $('#new-chat').addEventListener('click', newChat);
  $('#mobile-new').addEventListener('click', newChat);
  $('#sidebar-close').addEventListener('click', () => setSidebarOpen(false));
  $('#sidebar-open').addEventListener('click', () => setSidebarOpen(true));
  $('#menu').addEventListener('click', () => setSidebarOpen(true));
  $('#scrim').addEventListener('click', () => setSidebarOpen(false));
  scrollBottom.addEventListener('click', () => {
    // Jumping during a reply follows it again. The jump is instant then, since
    // a smooth scroll's first scroll events would stop following midway.
    followResponse = Boolean(controller);
    scrollToLatest(controller || window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth');
  });
  window.addEventListener('scroll', onPageScroll, {passive: true});
  window.addEventListener('resize', () => {
    updateSidebar();
    chat.querySelectorAll('.reasoning').forEach(updateReasoningFade);
    updateResponseScroll();
  });
  chat.addEventListener('load', updateResponseScroll, true);
  updateSidebar();
  renderChat();
  renderRecents();
  updateComposer();
  loadModalities();
</script>
</html>
