<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splash Dashboard</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<style>
  * { box-sizing: border-box }
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --side: #f9f9f9;
    --text: #171717;
    --muted: #727272;
    --link: #2563eb;
    --hover: #ececec;
    --bubble: #f1f1f1;
    --composer: #fff;
    --border: #e5e5e5;
    --shadow: 0 8px 28px #00000012;
    --ok: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --side: #181818;
      --text: #ececec;
      --muted: #9b9b9b;
      --link: #60a5fa;
      --hover: #2b2b2b;
      --bubble: #303030;
      --composer: #2f2f2f;
      --border: #424242;
      --shadow: 0 8px 28px #0005;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
    }
  }
  body { margin: 0; color: var(--text); background: var(--bg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  header { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px; background: var(--side); border-bottom: 1px solid var(--border) }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 650; letter-spacing: -.02em }
  .brand img { width: 19px; height: 19px }
  #model-name { color: var(--muted); font-size: 13px; font-weight: 450; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  #key-form { display: flex; gap: 6px }
  #key-form[hidden] { display: none }
  #key-input { width: 170px; padding: 5px 9px; font: inherit; font-size: 13px; color: var(--text); background: var(--composer); border: 1px solid var(--border); border-radius: 7px }
  #key-apply { padding: 5px 11px; font: inherit; font-size: 13px; color: var(--text); background: var(--hover); border: 1px solid var(--border); border-radius: 7px; cursor: pointer }
  #strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--bg); border: 1px solid var(--border); white-space: nowrap }
  .chip-ok { color: var(--ok) }
  .chip-warn { color: var(--warn) }
  .chip-bad { color: var(--bad) }
  .chip-na { opacity: .65 }
  main.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start; min-height: calc(100vh - 56px); padding: 24px 20px; max-width: 1280px; margin: 0 auto }
  @media (max-width: 900px) { main.grid { grid-template-columns: 1fr } #model-name { display: none } }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow) }
  .card-title { margin: 0 0 10px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
  .card-body { min-height: 140px }
  .card-placeholder { color: var(--muted); opacity: .6; font-size: 13px; padding: 44px 0; text-align: center }
  #gauges canvas { max-width: 100%; height: auto }
  .gauges-body { display: flex; gap: 18px; align-items: center; min-height: 210px }
  .gauge-main { display: flex; flex-direction: column; align-items: center; gap: 6px }
  #gauge-note { font-size: 12px }
  .gauge-side { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 16px; min-width: 0 }
  .gauge-sub { display: flex; flex-direction: column; align-items: center; gap: 3px }
  .gauge-sub-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
  .gauge-sub-detail { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
  .gauge-sparks { display: flex; flex-direction: column; gap: 1px; min-width: 0 }
  .spark-label { font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums }
  .gauge-tiles { grid-column: 1 / -1; display: flex; gap: 12px }
  .tile { flex: 1; display: flex; flex-direction: column; gap: 1px; background: var(--hover); border-radius: 8px; padding: 7px 10px }
  .tile-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
  .tile-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums }
  .tile-sub { font-size: 10px; color: var(--muted) }
</style>
<script src="/dashboard-assets/chart-4.5.1.min.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <img src="/favicon.ico" alt="">
    Splash Dashboard
  </div>
  <span id="model-name"></span>
  <form id="key-form" hidden autocomplete="off">
    <input id="key-input" type="password" placeholder="API key" autocomplete="off">
    <button id="key-apply" type="button">Apply</button>
  </form>
  <div id="strip"><span id="updated" class="chip chip-na">—</span></div>
</header>
<main class="grid">
  <section class="card" id="gauges"><h2 class="card-title">Speed</h2><div class="card-body gauges-body">
    <div class="gauge-main">
      <canvas id="gauge-speed" width="220" height="200"></canvas>
      <span id="gauge-note" class="chip chip-na">n/a</span>
    </div>
    <div class="gauge-side">
      <div class="gauge-sub">
        <canvas id="gauge-accept" width="108" height="108"></canvas>
        <span id="gauge-accept-label" class="gauge-sub-label">draft acceptance</span>
        <span id="gauge-accept-detail" class="gauge-sub-detail">n/a</span>
      </div>
      <div class="gauge-sparks">
        <canvas id="spark-ttft" width="160" height="46"></canvas>
        <span class="spark-label">TTFT <span id="ttft-now">n/a</span></span>
        <canvas id="spark-itl" width="160" height="46"></canvas>
        <span class="spark-label">ITL <span id="itl-now">n/a</span></span>
      </div>
      <div class="gauge-tiles">
        <div class="tile"><span class="tile-label">prefill</span><span class="tile-value" id="tile-prefill">n/a</span><span class="tile-sub">since start</span></div>
        <div class="tile"><span class="tile-label">decode</span><span class="tile-value" id="tile-decode">n/a</span><span class="tile-sub">since start</span></div>
      </div>
    </div>
  </div></section>
  <section class="card" id="cache"><h2 class="card-title">KV cache</h2><div class="card-body"><div class="card-placeholder">—</div></div></section>
  <section class="card" id="memory"><h2 class="card-title">Memory</h2><div class="card-body"><div class="card-placeholder">—</div></div></section>
  <section class="card" id="requests"><h2 class="card-title">Requests</h2><div class="card-body"><div class="card-placeholder">—</div></div></section>
  <section class="card" id="ane"><h2 class="card-title">Neural engine</h2><div class="card-body"><div class="card-placeholder">—</div></div></section>
  <section class="card" id="model"><h2 class="card-title">Model</h2><div class="card-body"><div class="card-placeholder">—</div></div></section>
</main>
<script>
'use strict';
// ------------------------------------------------------------------ state
const state = {
  key: null,          // in-memory only — never persisted
  lastStatus: null,   // last successful /status document
  lastOkAt: 0,        // Date.now() of the last successful /status
  failed: 0,          // consecutive failed polls (drives the backoff)
  authBlocked: false, // set on 401; polling stops until a key is applied
  pollSeq: 0,         // superseded in-flight responses are ignored
  pollTimer: 0,
  tickerTimer: 0,
  palette: null,
  prevCounters: null, // last /status token counters (windowed diffs)
  prevPollAt: 0,      // Date.now() of the last windowed /status
  lastRestarts: null, // last seen transport.restarts (null = no baseline yet)
  // Batch recency guard (see batchFallback): a content key per batch kind and
  // a count of consecutive unchanged polls.
  batchKeys: { dKey: null, pKey: null, dStale: 0, pStale: 0 },
};

// ------------------------------------------------------------- formatters
const fmt = {
  bytes(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return 'n/a';
    const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
    let i = 0;
    let v = Number(n);
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
    return (i === 0 ? String(Math.round(v)) : v.toFixed(1)) + ' ' + units[i];
  },
  num(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return 'n/a';
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  },
  ms(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return 'n/a';
    return v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(1) + ' s';
  },
  pct(v) {
    if (v === null || v === undefined || Number.isNaN(v)) return 'n/a';
    return Math.round(v * 100) + '%';
  },
  clock(sec) {
    if (sec === null || sec === undefined || Number.isNaN(sec)) return 'n/a';
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    if (m) return m + 'm ' + String(s).padStart(2, '0') + 's';
    return s + 's';
  },
};

// ----------------------------------------------------------------- chips
function chip(node, level, text) {
  node.className = 'chip chip-' + level;
  node.textContent = text;
  return node;
}
function na(node) { return chip(node, 'na', 'n/a'); }

// Status strip: one persistent chip per engine signal, plus #updated.
const strip = document.getElementById('strip');
const updatedChip = document.getElementById('updated');
function makeChip(name) {
  const el = document.createElement('span');
  el.dataset.name = name;
  na(el);
  el.hidden = true;
  strip.appendChild(el);
  return el;
}
const cWaiting = makeChip('waiting');
const cReady = makeChip('ready');
const cThermal = makeChip('thermal');
const cPressure = makeChip('pressure');
const cMetal = makeChip('metal');
const cTransport = makeChip('transport');
const cTick = makeChip('tick');
const cStale = makeChip('stale');
const dataChips = [cReady, cThermal, cPressure, cMetal, cTransport, cTick, cStale];
// ------------------------------------------------------------- strip panel
const THERMAL = { nominal: 'ok', fair: 'warn', serious: 'bad', critical: 'bad' };
const PRESSURE = { normal: 'ok', warning: 'warn', critical: 'bad' };

function hideDataChips() {
  dataChips.forEach((el) => { el.hidden = true; na(el); });
}

function refreshStale() {
  const t = state.lastStatus && state.lastStatus.transport;
  const stale = !!(t && t.status_stale) ||
    (state.lastOkAt > 0 && Date.now() - state.lastOkAt > 10000);
  cStale.hidden = !stale;
  if (stale) chip(cStale, 'bad', 'stale');
}

function refreshUpdated() {
  if (!state.lastOkAt) {
    chip(updatedChip, 'na', '—');
    return;
  }
  const age = Math.max(0, Math.floor((Date.now() - state.lastOkAt) / 1000));
  chip(updatedChip, age > 30 ? 'bad' : age > 10 || state.failed > 0 ? 'warn' : 'ok', 'updated ' + age + 's ago');
  refreshStale();
}

function renderStrip(status) {
  const s = status || {};
  if (!status || s.ready === false) {
    cWaiting.hidden = false;
    chip(cWaiting, 'warn', 'waiting for engine');
    hideDataChips();
    refreshUpdated();
    return;
  }
  cWaiting.hidden = true;
  dataChips.slice(0, 6).forEach((el) => { el.hidden = false; });
  if (s.ready == null) na(cReady);
  else chip(cReady, s.ready ? 'ok' : 'bad', s.ready ? 'ready' : 'not ready');
  const thermal = s.thermal_state;
  if (thermal == null) na(cThermal);
  else chip(cThermal, THERMAL[thermal] || 'na', thermal);
  const pressure = s.memory_pressure;
  if (pressure == null) na(cPressure);
  else chip(cPressure, PRESSURE[pressure] || 'na', pressure);
  if (!s.metal || s.metal.healthy == null) na(cMetal);
  else {
    chip(cMetal, s.metal.healthy ? 'ok' : 'bad', s.metal.healthy ? 'Metal' : 'Metal down');
    cMetal.title = s.metal.failure_reason || '';
  }
  const t = s.transport;
  if (!t) na(cTransport);
  else if (t.stopped) chip(cTransport, 'bad', 'stopped');
  else if (t.recovering) chip(cTransport, 'warn', 'recovering');
  else if (t.ready) chip(cTransport, 'ok', 'ready');
  else na(cTransport);
  const tick = s.loop ? s.loop.max_tick_ms : undefined;
  if (tick === null || tick === undefined) na(cTick);
  else chip(cTick, tick > 1000 ? 'warn' : 'ok', fmt.ms(tick));
  refreshUpdated();
}

// --------------------------------------------------------- render dispatch
const panels = { strip: renderStrip, gauges: renderGauges }; // Tasks 4-5 register the remaining panels

function render(status) {
  state.lastStatus = status || null;
  const model = status && status.instance && status.instance.model;
  if (model) document.getElementById('model-name').textContent = model;
  for (const fn of Object.values(panels)) {
    try { fn(status); } catch (err) { console.warn('dashboard panel error:', err); }
  }
}
// -------------------------------------------------------------- gauges
// 1/2/5·10ⁿ scale ceiling, with a 10 tok/s floor so dials stay readable.
function niceMax(x) {
  if (!Number.isFinite(x) || x <= 0) return 10;
  const exp = Math.floor(Math.log10(x));
  const frac = x / Math.pow(10, exp);
  const nice = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
  return nice * Math.pow(10, exp);
}

// The active-phase decision, made mechanical: tok/s for the current poll
// window, from diffs of the engine's cumulative counters. A restart (counter
// reset) or an over-long window yields 0 rather than a bogus spike.
function windowedRates(status) {
  const m = (status && status.metrics) || {};
  const t = (status && status.transport) || {};
  const now = Date.now();
  const out = { prefill: 0, decode: 0 };
  if (state.prevCounters) {
    const dt = (now - state.prevPollAt) / 1000;
    const restarted = t.restarts !== state.lastRestarts;
    if (dt > 0 && dt < 120 && !restarted) {
      const pre = m.prefill_input_tokens;
      const dec = m.decode_output_tokens;
      if (pre != null && pre - state.prevCounters.prefill >= 0) {
        out.prefill = (pre - state.prevCounters.prefill) / dt;
      }
      if (dec != null && dec - state.prevCounters.decode >= 0) {
        out.decode = (dec - state.prevCounters.decode) / dt;
      }
    }
  }
  // One baseline per counter: a doc missing a counter must not re-zero the
  // other, and a counterless doc must not advance the window clock.
  if (m.prefill_input_tokens != null || m.decode_output_tokens != null) {
    state.prevCounters = state.prevCounters || { prefill: 0, decode: 0 };
    if (m.prefill_input_tokens != null) state.prevCounters.prefill = m.prefill_input_tokens;
    if (m.decode_output_tokens != null) state.prevCounters.decode = m.decode_output_tokens;
    state.prevPollAt = now;
  }
  state.lastRestarts = t.restarts ?? state.lastRestarts;
  return out;
}

// Draws the needle (speedometer) or a center value (full circle), plus the
// value and label text, on the gauge canvas. Text is pre-computed by set().
const needlePlugin = {
  id: 'dashNeedle',
  afterDraw(chart) {
    const meta = chart.getDatasetMeta(0);
    const arc = meta && meta.data && meta.data[0];
    const n = chart.$needle;
    if (!arc || !n) return;
    const cx = arc.x;
    const cy = arc.y;
    const R = arc.outerRadius;
    const pal = chart.$palette || { text: '#000', muted: '#888' };
    const ctx = chart.ctx;
    ctx.save();
    ctx.textAlign = 'center';
    if (n.needle !== false) {
      const frac = Number.isFinite(n.fraction) ? Math.max(0, Math.min(1, n.fraction)) : 0;
      // Follow the eased arc mid-animation. Where no arc angles exist (harness
      // stubs), fall back to the static rotation formula.
      const ang = typeof arc.endAngle === 'number'
        ? arc.endAngle + Math.PI / 2
        : ((n.rotation || 240) + frac * (n.circumference || 240)) * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.sin(ang) * R * 0.8, cy - Math.cos(ang) * R * 0.8);
      ctx.lineWidth = 2;
      ctx.strokeStyle = pal.text;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = pal.text;
      ctx.fill();
      ctx.font = '600 16px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = pal.text;
      ctx.fillText(n.valueText || '', cx, cy + R * 0.55);
      ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = pal.muted;
      ctx.fillText(n.labelText || '', cx, cy + R * 0.55 + 13);
    } else {
      ctx.font = '600 15px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = pal.text;
      ctx.fillText(n.valueText || '', cx, cy + 5);
    }
    ctx.restore();
  },
};

// Doughnut gauge: value segment over a track, needle/center readout.
function makeGauge(canvas, { label, unit, mode, rotation = 240, circumference = 240, cutout = '74%', needle = true }) {
  const pal = palette();
  const chart = new Chart(canvas, {
    type: 'doughnut',
    data: { datasets: [{ data: [0, 100], backgroundColor: [pal.link, pal.border], borderWidth: 0, borderRadius: 6 }] },
    options: {
      rotation,
      circumference,
      cutout,
      responsive: false,
      animation: { duration: 450, easing: 'easeOutQuad' },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    },
    plugins: [needlePlugin],
  });
  chart.$palette = pal;
  // n/a first: Chart.js renders on construction, and a key-required visitor
  // must not read fake zeros off the canvases.
  chart.$needle = { needle, rotation, circumference, fraction: 0, valueText: 'n/a', labelText: '' };
  charts.push({
    kind: mode,
    chart,
    rebuild() {
      const p = palette();
      chart.$palette = p;
      chart.data.datasets[0].backgroundColor = [p.link, p.border];
      chart.update('none');
    },
  });
  return {
    chart,
    set(value, max, labelText) {
      const v = Number.isFinite(value) ? Math.max(0, value) : 0;
      const f = Math.max(0, Math.min(1, v / Math.max(max, 1e-6)));
      chart.data.datasets[0].data = [f * 100, 100 - f * 100];
      chart.$needle.fraction = f;
      chart.$needle.valueText = fmt.num(v) + ' ' + unit;
      chart.$needle.labelText = labelText || label;
      chart.update();
    },
  };
}

// 150-sample rolling line (p50 solid, p95 dashed); null samples gap out.
function makeSparkline(canvas, colorKey, kind) {
  const pal = palette();
  const chart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { data: [], borderColor: pal[colorKey] || pal.link, borderWidth: 1.5, pointRadius: 0, tension: 0.3, spanGaps: false },
        { data: [], borderColor: pal.muted, borderWidth: 1, borderDash: [3, 3], pointRadius: 0, tension: 0.3, spanGaps: false },
      ],
    },
    options: {
      responsive: false,
      animation: false,
      scales: { x: { display: false }, y: { display: false, beginAtZero: true, max: 100 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    },
  });
  charts.push({
    kind,
    chart,
    rebuild() {
      const p = palette();
      chart.data.datasets[0].borderColor = p[colorKey] || p.link;
      chart.data.datasets[1].borderColor = p.muted;
      chart.update('none');
    },
  });
  const RING = 150;
  const r50 = [];
  const r95 = [];
  return {
    chart,
    push(v50, v95) {
      r50.push(v50 == null || Number.isNaN(v50) ? null : v50);
      r95.push(v95 == null || Number.isNaN(v95) ? null : v95);
      while (r50.length > RING) r50.shift();
      while (r95.length > RING) r95.shift();
      chart.data.datasets[0].data = r50;
      chart.data.datasets[1].data = r95;
      chart.data.labels = r50.map((_, i) => i);
      const vals = r50.concat(r95).filter((v) => v != null);
      chart.options.scales.y.max = niceMax(Math.max(1, ...vals));
      chart.update('none');
    },
    clear() {
      r50.length = 0;
      r95.length = 0;
      chart.data.datasets[0].data = [];
      chart.data.datasets[1].data = [];
      chart.data.labels = [];
      chart.options.scales.y.max = 100;
      chart.update('none');
    },
  };
}

// Gauge DOM + windowed state: 3-window rings, per-mode max since last restart.
const gaugeNote = document.getElementById('gauge-note');
const acceptDetail = document.getElementById('gauge-accept-detail');
const tilePrefill = document.getElementById('tile-prefill');
const tileDecode = document.getElementById('tile-decode');
const ttftNow = document.getElementById('ttft-now');
const itlNow = document.getElementById('itl-now');
const PHASE_LABEL = { idle: 'idle', prefill: 'prefilling', decode: 'decoding' };
const rings = { prefill: [], decode: [] };
const maxSeen = { prefill: 0, decode: 0 };
let restartNote = false;

// The engine keeps the last completed batch's snapshot with `valid: true`
// until the next same-kind batch completes; the flag never decays with idle
// time (Status.hpp). A batch object unchanged across consecutive polls is
// therefore stale. Track a content key per kind; N unchanged polls read as
// idle. Cleared on an observed restart.
const BATCH_STALE_POLLS = 5; // ~10 s at the 2 s poll cadence
function batchFallback(m) {
  const b = state.batchKeys;
  const d = m.current_decode_batch && m.current_decode_batch.valid ? m.current_decode_batch : null;
  const p = m.current_prefill_batch && m.current_prefill_batch.valid ? m.current_prefill_batch : null;
  const dKey = d ? JSON.stringify(d) : null;
  const pKey = p ? JSON.stringify(p) : null;
  b.dStale = dKey !== null && dKey === b.dKey ? b.dStale + 1 : 0;
  b.pStale = pKey !== null && pKey === b.pKey ? b.pStale + 1 : 0;
  b.dKey = dKey;
  b.pKey = pKey;
  if (dKey !== null && b.dStale < BATCH_STALE_POLLS) return 'decode';
  if (pKey !== null && b.pStale < BATCH_STALE_POLLS) return 'prefill';
  return 'idle';
}

function renderGauges(status) {
  const s = status || {};
  const m = s.metrics || {};
  const t = s.transport || {};
  const sched = s.scheduler || {};
  const live = !!s && s.ready !== false;
  // Baseline bookkeeping: the first doc with a restarts counter only sets the
  // baseline (an engine that restarted before the tab opened is not a restart
  // this tab witnessed). A crash samples as ready:false docs carrying the
  // increment, so the note fires on that doc, not only on live docs.
  // Compare before windowedRates overwrites the stored value.
  const restarted = state.lastRestarts !== null && t.restarts != null && t.restarts !== state.lastRestarts;
  const rates = live ? windowedRates(status) : { prefill: 0, decode: 0 };
  if (t.restarts != null) state.lastRestarts = t.restarts;
  // An observed restart clears the rings/sparklines and fires the note.
  if (restarted) {
    rings.prefill.length = 0;
    rings.decode.length = 0;
    maxSeen.prefill = 0;
    maxSeen.decode = 0;
    sparkTTFT.clear();
    sparkITL.clear();
    state.batchKeys = { dKey: null, pKey: null, dStale: 0, pStale: 0 };
    restartNote = true;
  }
  if (live) {
    rings.prefill.push(rates.prefill);
    rings.decode.push(rates.decode);
    if (rings.prefill.length > 3) rings.prefill.shift();
    if (rings.decode.length > 3) rings.decode.shift();
    maxSeen.prefill = Math.max(maxSeen.prefill, rates.prefill);
    maxSeen.decode = Math.max(maxSeen.decode, rates.decode);
  }
  // Active phase: scheduler occupancy first. Then the newest valid batch —
  // recency-guarded, because the engine's valid flag never decays with idle.
  let phase = 'idle';
  let batchRate = 0;
  if ((sched.decoding ?? 0) > 0) {
    phase = 'decode';
  } else if ((sched.prefilling ?? 0) > 0) {
    phase = 'prefill';
  } else if (live) {
    phase = batchFallback(m);
    if (phase === 'decode') batchRate = (m.current_decode_batch && m.current_decode_batch.tokens_per_second) || 0;
    if (phase === 'prefill') batchRate = (m.current_prefill_batch && m.current_prefill_batch.tokens_per_second) || 0;
  }
  const mean = (r) => (r.length ? r.reduce((a, b) => a + b, 0) / r.length : 0);
  const fromBatch = phase !== 'idle' && !(sched.decoding ?? 0) && !(sched.prefilling ?? 0);
  const value = phase === 'idle' ? 0
    : phase === 'prefill' ? (fromBatch ? batchRate : mean(rings.prefill))
    : (fromBatch ? batchRate : mean(rings.decode));
  const scale = phase === 'idle'
    ? niceMax(Math.max(10, maxSeen.prefill, maxSeen.decode))
    : niceMax(Math.max(10, maxSeen[phase], value));
  speedGauge.set(value, scale, PHASE_LABEL[phase]);
  if (restarted) {
    chip(gaugeNote, 'warn', 'engine restarted');
  } else if (restartNote) {
    // Hold the visible note until the engine produces a nonzero window.
    if (value > 0) {
      restartNote = false;
      chip(gaugeNote, 'ok', PHASE_LABEL[phase]);
    }
  } else {
    chip(gaugeNote, phase === 'idle' ? 'na' : 'ok', PHASE_LABEL[phase]);
  }
  // Draft acceptance (engine-computed rate; n/a until it exists).
  const drafted = m.drafted_tokens;
  const accepted = m.accepted_draft_tokens;
  const rate = m.draft_acceptance_rate;
  if (drafted == null || drafted === 0 || accepted == null || rate == null || Number.isNaN(rate)) {
    acceptGauge.set(0, 100);
    acceptGauge.chart.$needle.valueText = 'n/a';
    acceptGauge.chart.update('none');
    acceptDetail.textContent = 'n/a';
  } else {
    acceptGauge.set(Math.max(0, Math.min(100, rate * 100)), 100);
    acceptDetail.textContent = fmt.num(accepted) + ' of ' + fmt.num(drafted) + ' drafts';
  }
  // Lifetime averages: small tiles; the dial shows the current window. A
  // lifetime average of 0 means no tokens were counted: sentinel, not a rate.
  tilePrefill.textContent = m.prefill_tokens_per_second == null || m.prefill_tokens_per_second === 0 ? 'n/a' : fmt.num(m.prefill_tokens_per_second) + ' tok/s';
  tileDecode.textContent = m.decode_tokens_per_second == null || m.decode_tokens_per_second === 0 ? 'n/a' : fmt.num(m.decode_tokens_per_second) + ' tok/s';
  // samples: 0 means the latency window held no request: the zeros are
  // sentinels, so the sparkline gaps out and the label reads n/a.
  const ttft = m.ttft_ms;
  const itl = m.itl_ms;
  const ttftHas = !!ttft && ttft.samples > 0;
  const itlHas = !!itl && itl.samples > 0;
  sparkTTFT.push(ttftHas ? ttft.p50 : null, ttftHas ? ttft.p95 : null);
  sparkITL.push(itlHas ? itl.p50 : null, itlHas ? itl.p95 : null);
  ttftNow.textContent = ttftHas && ttft.p50 != null && !Number.isNaN(ttft.p50) ? fmt.ms(ttft.p50) : 'n/a';
  itlNow.textContent = itlHas && itl.p50 != null && !Number.isNaN(itl.p50) ? fmt.ms(itl.p50) : 'n/a';
}
// --------------------------------------------------------------- polling
async function pollOnce() {
  const seq = ++state.pollSeq;
  try {
    const headers = {};
    if (state.key) headers.Authorization = 'Bearer ' + state.key;
    const res = await fetch('/status', { headers });
    if (seq !== state.pollSeq) return; // superseded
    if (res.status === 401) {
      state.authBlocked = true;
      state.failed = 0;
      keyForm.hidden = false;
      cWaiting.hidden = false;
      chip(cWaiting, 'warn', 'API key required');
      hideDataChips();
      chip(updatedChip, 'na', '—');
      return;
    }
    if (!res.ok) throw new Error('status HTTP ' + res.status);
    const status = await res.json();
    if (seq !== state.pollSeq) return; // superseded
    state.failed = 0;
    state.lastOkAt = Date.now();
    render(status);
  } catch (err) {
    if (seq !== state.pollSeq) return;
    state.failed += 1;
    cWaiting.hidden = false;
    chip(cWaiting, 'bad', 'offline — retrying');
    hideDataChips();
  } finally {
    scheduleNext();
  }
}

function scheduleNext() {
  if (state.pollTimer) clearTimeout(state.pollTimer);
  if (state.authBlocked) return;
  const interval = state.failed > 0
    ? Math.min(2000 * Math.pow(2.5, state.failed - 1), 10000) // 2s -> 5s -> 10s, capped
    : (document.hidden ? 10000 : 2000);
  state.pollTimer = setTimeout(pollOnce, interval);
}

// 1s ticker: ages the "updated" chip and the stale flag.
function tick() {
  state.tickerTimer = setTimeout(tick, 1000);
  if (state.lastOkAt) refreshUpdated();
}

// -------------------------------------------------------------- key form
const keyForm = document.getElementById('key-form');
const keyInput = document.getElementById('key-input');
const keyApply = document.getElementById('key-apply');
function applyKey() {
  state.key = keyInput.value.trim() || null;
  state.authBlocked = false;
  keyForm.hidden = true;
  keyInput.value = '';
  state.pollSeq += 1; // supersede anything in flight
  pollOnce();
}
keyApply.addEventListener('click', (e) => { e.preventDefault(); applyKey(); });
keyForm.addEventListener('submit', (e) => { e.preventDefault(); applyKey(); });

// ----------------------------------------------------------------- theme
const charts = []; // Tasks 3-5 register { rebuild() } entries
function palette() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name) => cs.getPropertyValue(name).trim();
  return {
    text: v('--text'), muted: v('--muted'), link: v('--link'),
    border: v('--border'), ok: v('--ok'), warn: v('--warn'), bad: v('--bad'),
  };
}
function rethemeAll() {
  state.palette = palette();
  for (const c of charts) {
    try { c.rebuild ? c.rebuild() : c.update(); } catch (err) { console.warn('retheme error:', err); }
  }
}
const mediaQuery = matchMedia('(prefers-color-scheme: dark)');
if (mediaQuery.addEventListener) mediaQuery.addEventListener('change', rethemeAll);
else if (mediaQuery.addListener) mediaQuery.addListener(rethemeAll);
state.palette = palette();

// -------------------------------------------------------------- start
const speedGauge = makeGauge(document.getElementById('gauge-speed'), { label: 'idle', unit: 'tok/s', mode: 'speedometer' });
const acceptGauge = makeGauge(document.getElementById('gauge-accept'), { label: 'draft acceptance', unit: '%', mode: 'acceptance', rotation: 0, circumference: 360, cutout: '80%', needle: false });
const sparkTTFT = makeSparkline(document.getElementById('spark-ttft'), 'link', 'sparkline-ttft');
const sparkITL = makeSparkline(document.getElementById('spark-itl'), 'ok', 'sparkline-itl');
chip(cWaiting, 'warn', 'waiting for engine');
cWaiting.hidden = false;
pollOnce();
state.tickerTimer = setTimeout(tick, 1000);

window.__dash = { state, pollOnce, scheduleNext, render, palette, rethemeAll, na, chip, fmt, panels, charts };
</script>
</body>
</html>
