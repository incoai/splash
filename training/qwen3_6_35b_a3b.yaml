# Selector-only continuation against the frozen Qwen3.6 MoE teacher.
# This is a starting diagnostic, not a validated effectiveness recipe.
seed: 42
max_steps: 100
sequence_length: 2048
batch_size: 1
gradient_accumulation: 4
learning_rate: 0.00001
weight_decay: 0.01
max_grad_norm: 1.0
selector_loss_weight: 1.0
selector_warmup_steps: 10
checkpoint_interval: 10
validation_interval: 10
max_new_tokens: 128
enable_thinking: true
# The pinned Qwen3.6 template ignores effort; enable_thinking controls its mode.
reasoning_effort: medium
max_validation_blocks: 64
vocabulary_chunk_rows: 1
trainable: selector
