name: Refresh official model catalog

# install/completions/official-models.txt is generated from the Splash
# collection on Hugging Face and bundled into the shell completion, so it can
# drift the moment a model is added to the collection. This keeps it in sync
# without waiting for someone to remember.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: model-catalog
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate from the Hugging Face collection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refresh the catalog
        env:
          # Only required while the collection is private. Drop once the
          # collection is public under incoai/.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python dev/tools/update_model_catalog.py

      - name: Open a pull request if the catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CATALOG=install/completions/official-models.txt

          # Refuse to act if anything other than the generated file moved.
          CHANGED=$(git diff --name-only)
          if [ -z "$CHANGED" ]; then
            echo "Catalog already matches the collection."
            exit 0
          fi
          if [ "$CHANGED" != "$CATALOG" ]; then
            echo "Unexpected files changed; refusing to open a PR:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

          BRANCH=automation/model-catalog
          REMOTE_TIP=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$CATALOG"
          git commit -m "Refresh official model catalog from the Splash collection"
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_TIP" origin "$BRANCH"
          # A push or pull request made with GITHUB_TOKEN starts no workflow, a
          # dispatch does: CI runs on the pushed commit, the pull request's
          # head, where its checks land. The hardware release gate stays off.
          gh workflow run ci.yml --ref "$BRANCH" -f release_gate=false

          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "Existing pull request updated."
            exit 0
          fi
          gh pr create \
            --base main --head "$BRANCH" \
            --title "Refresh official model catalog" \
            --body "$(printf '%s\n' \
              'The Splash collection on Hugging Face no longer matches the catalog bundled with shell completion.' \
              '' \
              'Generated by `dev/tools/update_model_catalog.py`. The job refuses to open a pull request if anything other than `install/completions/official-models.txt` changed.')"
