name: Splash runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_gate:
        description: Run the real-model release gate on the Apple Silicon hardware matrix
        required: false
        type: boolean
        default: false
      expect_output_change:
        description: Allow outputs that differ from the baseline's, with acceptance within 0.02 (EXPECT_OUTPUT_CHANGE=1)
        required: false
        type: boolean
        default: false

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  engine-check:
    name: Production, CPU runtime, and sanitizers
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build production and run CPU runtime checks
        run: make check-source check-native-cpu PYTHON_CANDIDATES=python3
      - name: Run native sanitizers
        run: make test-sanitizers

  python-compatibility:
    name: Python compatibility ${{ matrix.python-version }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            install/requirements.txt
            dev/requirements.txt
      - name: Run current runtime Python, model-manifest, and source checks
        run: |
          make check-python-engine PYTHON_CANDIDATES=python3
          actual=$(.venv/bin/python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          test "$actual" = "${{ matrix.python-version }}"

  release-hardware:
    name: Release gate (${{ matrix.runner_label }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == true }}
    strategy:
      fail-fast: false
      matrix:
        runner_label:
          - splash-m3-max-48
          - splash-m4-pro-48
          - splash-m4-max-64plus
          - splash-m5-pro-48
          - splash-m5-pro-64
          - splash-m5-max-48
          - splash-m5-max-64plus
    runs-on: [self-hosted, macOS, ARM64, "${{ matrix.runner_label }}"]
    env:
      PYTHON_CANDIDATES: python3
      EXPECT_OUTPUT_CHANGE: ${{ inputs.expect_output_change && '1' || '' }}
    # Older Apple GPUs can spend substantially longer in the real context and
    # quality gates. The job must fail on an engine/test result, not an
    # arbitrary job timer.
    timeout-minutes: 360
    # The Metal suite once, then each model of DEVELOPMENT.md's Release check
    # (MLX and GGUF, dense and MoE, each at one commit, and a legacy package)
    # against the runner's retained baseline build, RUNNER_BASELINE, which
    # release-check requires and which must load every model: the previous
    # release's build, or while that loads no upstream model (1.0.x, for 1.1)
    # a build of the last commit before the change under test. Every model
    # runs even when an earlier step failed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the shader-validated Metal suite
        run: make check-native-metal
      - name: mlx-community/Qwen3.8-27B-4bit
        if: ${{ !cancelled() }}
        run: >-
          make install release-check BASELINE="$RUNNER_BASELINE"
          MODEL=mlx-community/Qwen3.8-27B-4bit
          REVISION=3e6447f082e89cc7f0bc6e5441afd38dfce760ff
      - name: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M, text only
        if: ${{ !cancelled() }}
        run: >-
          make install release-check BASELINE="$RUNNER_BASELINE"
          MODEL=unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_M LANGUAGE_ONLY=1
          REVISION=4ca720788d1e01f1bff70c033e0d0028fd02e502
      - name: mlx-community/Qwen3.6-35B-A3B-4bit
        if: ${{ !cancelled() }}
        run: >-
          make install release-check BASELINE="$RUNNER_BASELINE"
          MODEL=mlx-community/Qwen3.6-35B-A3B-4bit
          REVISION=38740b847e4cb78f352aba30aa41c76e08e6eb46
      - name: unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
        if: ${{ !cancelled() }}
        run: >-
          make install release-check BASELINE="$RUNNER_BASELINE"
          MODEL=unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
          REVISION=a483e9e6cbd595906af30beda3187c2663a1118c
      - name: incoai/Qwen3.8-27B-Splash
        if: ${{ !cancelled() }}
        run: >-
          make install release-check BASELINE="$RUNNER_BASELINE"
          MODEL=incoai/Qwen3.8-27B-Splash
      - name: Preserve release reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-release-${{ runner.name }}-${{ strategy.job-index }}-${{ github.sha }}
          path: build/release/**/*.json
          if-no-files-found: ignore
